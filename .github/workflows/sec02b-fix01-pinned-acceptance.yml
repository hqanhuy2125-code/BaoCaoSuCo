name: SEC-02B FIX01 pinned acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/sec02b-fix01-pinned-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR49 commit (never merge ref)
        uses: actions/checkout@v4
        with:
          ref: b16c76c97d1c6d929a924c9d4449fdc215334375
          persist-credentials: false
      - name: Verify pinned SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b16c76c97d1c6d929a924c9d4449fdc215334375"
          git status --porcelain
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Environment versions
        run: |
          node --version
          npm --version
          java -version
      - name: Exact npm installation command
        working-directory: security/rules
        run: npm install --no-package-lock
      - name: Exact test command (four sequential suites)
        working-directory: security/rules
        run: npm test
      - name: Git integrity after test
        if: always()
        shell: bash
        run: |
          git status --short
          git diff --exit-code -- firestore.rules app/src/main security/rules/incidents.writepilot.candidate.rules
