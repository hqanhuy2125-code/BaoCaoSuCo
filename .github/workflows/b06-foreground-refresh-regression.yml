name: B06 foreground refresh regression
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/example/baocaosuco/resident/ResidentForegroundStatusRefresh.java'
      - 'app/src/main/java/com/example/baocaosuco/resident/AndroidResidentRefreshScheduler.java'
      - 'app/src/test/java/com/example/baocaosuco/resident/ResidentForegroundStatusRefreshTest.java'
      - '.github/workflows/b06-foreground-refresh-regression.yml'
permissions:
  contents: read
jobs:
  b06-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current GitHub PR merge preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify merge preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          echo "B06 merged preview: $(git rev-parse HEAD)"
          echo "B06 PR head: ${{ github.event.pull_request.head.sha }}"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Temporary Android SDK36 CI override
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/version = release(37)/version = release(36)/' app/build.gradle.kts
          grep -q 'version = release(36)' app/build.gradle.kts
      - name: Offline dummy Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "demo-b06-offline",
              "storage_bucket": "demo-b06-offline.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef123456",
                "android_client_info": {"package_name": "com.example.baocaosuco"}
              },
              "api_key": [{"current_key": "dummy-not-live"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: JUnit and debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Validate JUnit XML evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert paths, 'No JUnit XML files'
          t = f = e = s = 0
          for p in paths:
              x = ET.parse(p).getroot()
              t += int(x.attrib.get('tests', 0))
              f += int(x.attrib.get('failures', 0))
              e += int(x.attrib.get('errors', 0))
              s += int(x.attrib.get('skipped', 0))
          print(f'JUnit XML: {len(paths)} suites, tests={t}, failures={f}, errors={e}, skipped={s}')
          assert f == e == s == 0
          assert any('ResidentForegroundStatusRefreshTest' in p.name for p in paths), 'B06 suite missing'
          assert t >= 195, 'Expected baseline 183 + 12 B06 tests'
          PY
      - name: Assert no source files were altered by build
        if: always()
        run: git diff --exit-code -- app/src/main app/src/test
