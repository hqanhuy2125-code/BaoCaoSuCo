name: SEC-02B final pinned technical acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/sec02b-final-pinned-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-rules-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact final acceptance commit
        uses: actions/checkout@v4
        with:
          ref: 6c2e245f28e283a1c3ada573cd57faf093baa364
          persist-credentials: false
      - name: Assert exact tested commit and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6c2e245f28e283a1c3ada573cd57faf093baa364"
          test -z "$(git status --porcelain)"
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Versions
        run: |
          node -v
          npm -v
          java -version
      - name: Exact install
        working-directory: security/rules
        run: npm install --no-package-lock
      - name: Run five sequential suites
        working-directory: security/rules
        run: npm test
      - name: Check repository has no altered protected source
        if: always()
        shell: bash
        run: |
          git status --short
          git diff --exit-code -- firestore.rules app/src/main
          git diff --exit-code -- security/rules/incidents.writepilot.candidate.rules
